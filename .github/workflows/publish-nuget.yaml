name: Publish RaidSeeder

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node for RaidCanvas hydration verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate tag matches raid.csproj version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" raid/raid.csproj)
          echo "Tag version: ${TAG_VERSION}"
          echo "Project version: ${CSPROJ_VERSION}"
          if [[ "${TAG_VERSION}" != "${CSPROJ_VERSION}" ]]; then
            echo "Tag version does not match raid/raid.csproj <Version>."
            exit 1
          fi

      - name: Restore
        run: dotnet restore RaidSeeder.slnx /p:UseLocalRAIkeepSources=false

      - name: Build
        run: dotnet build RaidSeeder.slnx --configuration Release --no-restore /p:UseLocalRAIkeepSources=false

      - name: Test
        run: dotnet test raid.Tests/raid.Tests.csproj --configuration Release --no-build --no-restore /p:UseLocalRAIkeepSources=false

      - name: Verify generated SVG with RaidCanvas 0.8.0 hydration
        shell: bash
        run: |
          npm ci --ignore-scripts
          dotnet run --project raid/raid.csproj \
            --configuration Release \
            --no-build \
            /p:UseLocalRAIkeepSources=false \
            -- import --puml raid.Tests/Fixtures/ChangeRequestWorkflow.puml --out artifacts/hydration --domain Examples
          node scripts/verify-raid-canvas-hydration.mjs artifacts/hydration/ChangeRequestWorkflow.svg

      - name: Pack
        run: dotnet pack raid/raid.csproj --configuration Release --no-build /p:UseLocalRAIkeepSources=false

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: Burkhardt

      - name: Publish to NuGet
        run: |
          dotnet nuget push "artifacts/nuget/*.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

  build-self-contained:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, osx-arm64, osx-x64, win-x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained binary
        run: |
          dotnet publish raid/raid.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            /p:PublishSingleFile=true \
            /p:UseLocalRAIkeepSources=false \
            --output "artifacts/publish/${{ matrix.rid }}"

      - name: Archive self-contained binary
        run: |
          mkdir -p artifacts/release
          VERSION="${GITHUB_REF_NAME:-manual}-${{ matrix.rid }}"
          cd artifacts/publish
          zip -r "../release/raid-${VERSION}.zip" "${{ matrix.rid }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: raid-${{ matrix.rid }}
          path: artifacts/release/raid-*.zip

  publish-self-contained-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-self-contained
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download self-contained artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists."
          else
            gh release create "${TAG}" --title "RaidSeeder ${VERSION}" --notes "RaidSeeder ${VERSION} self-contained binaries."
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts/release -name '*.zip' -print0 \
            | xargs -0 -I {} gh release upload "${GITHUB_REF_NAME}" "{}" --clobber
